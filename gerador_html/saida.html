<html>
<head><title>Formulario</title></head>
<body>
<form>
Descreva sua experiencia com o produto:<br>
<textarea name='Q0' cols='40' rows='5'></textarea><br>
<br>

Qual o seu nivel de satisfacao?<br>
<input type='radio' name='Q1' value='Otimo'>Otimo<br>
<input type='radio' name='Q1' value='Bom'>Bom<br>
<input type='radio' name='Q1' value='Regular'>Regular<br>
<input type='radio' name='Q1' value='Ruim'>Ruim<br>
<br>

Quais recursos voce usa?<br>
<input type='checkbox' name='Q2' value='Chat'>Chat<br>
<input type='checkbox' name='Q3' value='Email'>Email<br>
<input type='checkbox' name='Q4' value='Telefone'>Telefone<br>
<input type='checkbox' name='Q5' value='Video'>Video<br>
<br>

<label for='carro'>Escolha um carro:</label><br>
<select name='carro' id='carro'>
  <option value='volvo'>Volvo</option>
  <option value='saab'>Saab</option>
  <option value='mercedes'>Mercedes</option>
  <option value='audi'>Audi</option>
</select><br>
<br>

<button type='button' onclick="alert('Obrigado por participar da pesquisa!')">Clique aqui!</button><br>
<br>

<table border='1'>
  <caption>Economia Mensal</caption>
  <tr>
    <th>Mes</th>
    <th>Valor</th>
  </tr>
  <tr>
    <td>Janeiro</td>
    <td>R$ 100</td>
  </tr>
  <tr>
    <td>Fevereiro</td>
    <td>R$ 50</td>
  </tr>
  <tr>
    <td>Marco</td>
    <td>R$ 200</td>
  </tr>
</table><br>
<br>

</form>
</body>
</html>
